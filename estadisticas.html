<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef2f5">
<title>BITÁCORA · Estadísticas y Control</title>
<style>
  :root{--bg:#eef2f5;--bg2:#fff;--panel:#fff;--panel2:#e7eef2;--line:#b9c9d3;--line2:#d9e3e9;
    --ink:#11293a;--muted:#436072;--muted2:#6f8694;--cyan:#0a7d8c;--cyan-d:#0a5f6b;--amber:#a96b06;--green:#1e7d4f;--red:#bb352c;--gold:#8a6a2f;--gold2:#6e5318;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#0a1726;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .mark{width:38px;height:38px;border-radius:10px;flex:none;background:radial-gradient(circle at 35% 30%,#123243,#081521);border:1px solid #1f3e52;display:grid;place-items:center}
  .mark svg{width:21px;height:21px}
  .ht h1{font-size:18px;font-weight:800;letter-spacing:2.5px;background:linear-gradient(90deg,#e7c987,#c9a35e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ht p{font-size:10px;letter-spacing:1px;color:#6f8a9c;text-transform:uppercase}
  .hsp{flex:1}
  .nav a{color:#9fb6c4;text-decoration:none;font-size:12px;font-weight:700;padding:8px 13px;border-radius:9px;border:1px solid #1f3e52;margin-left:8px}
  .nav a:hover{background:#13283a;color:#fff}
  .live{display:flex;align-items:center;gap:7px;color:#56d390;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .live .d{width:8px;height:8px;border-radius:50%;background:#56d390;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 24px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:18px}
  .seg button{padding:10px 22px;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--cyan);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
  .kpi.k2::after{background:var(--green)}.kpi.k3::after{background:var(--amber)}.kpi.k4::after{background:var(--gold)}
  .kpi .v{font-size:38px;font-weight:800;line-height:1}
  .kpi .l{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .ct{font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--ink);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .bar-row .bl{width:130px;font-size:12.5px;font-weight:600;color:var(--ink);flex:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .bt{flex:1;height:24px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar-row .bt i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan-d),var(--cyan));min-width:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .bar-row .bt i.g{background:linear-gradient(90deg,#176b42,var(--green))}
  .bar-row .bt i.o{background:linear-gradient(90deg,#8a5604,var(--amber))}
  .bar-row .bv{width:42px;font-size:13px;font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .spark{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:8px}
  .spark .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .spark .col .bar{width:100%;max-width:42px;background:linear-gradient(180deg,var(--cyan),var(--cyan-d));border-radius:5px 5px 0 0;min-height:3px;transition:height .8s}
  .spark .col .cl{font-size:9.5px;color:var(--muted2);white-space:nowrap}
  .spark .col .cv{font-size:11px;font-weight:700;color:var(--ink)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
  .tbl td{padding:9px 10px;border-bottom:1px solid var(--line2)}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .tbl tr:hover td{background:#f4f8fa}
  .empty{color:var(--muted2);font-size:13px;text-align:center;padding:30px}
</style>
</head>
<body>
<header>
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.7" stroke-linecap="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7c987"/><stop offset="1" stop-color="#34d3df"/></linearGradient></defs><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="2.3" fill="#34d3df" stroke="none"/></svg></div>
  <div class="ht"><h1>ESTADÍSTICAS</h1><p>Control total de la operación</p></div>
  <div class="hsp"></div>
  <div class="live"><span class="d"></span>En vivo</div>
  <div class="nav"><a href="./">📋 Vale</a><a href="guardia.html">🗼 Guardia</a><a href="estadisticas.html" style="background:#13283a;color:#fff">📊 Estadísticas</a></div>
</header>
<div class="wrap">
  <div class="seg" id="rng">
    <button data-r="dia">Día</button><button data-r="sem">Semana</button>
    <button class="on" data-r="mes">Mes</button><button data-r="ano">Año</button><button data-r="all">Histórico</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="ct">📈 Despachos por período</div>
    <div class="spark" id="spark"></div>
  </div>

  <div class="grid2">
    <div class="card"><div class="ct">🚢 Por naviera / agencia</div><div id="byAgen"></div></div>
    <div class="card"><div class="ct">⚓ Por práctico (puntos)</div><div id="byPrac"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="ct">🛳 Top buques</div><div id="byBuque"></div></div>
    <div class="card"><div class="ct">📍 Por zona / canal</div><div id="byZona"></div></div>
  </div>

  <div class="card">
    <div class="ct">📋 Detalle por naviera</div>
    <table class="tbl" id="tblAgen"><thead><tr><th>Agencia</th><th class="n">Despachos</th><th class="n">Maniobras</th><th class="n">Entradas</th><th class="n">Salidas</th><th class="n">Cerrados</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
/* ===== CAPA DE INTEGRACIÓN BITÁCORA · base central compartida =====
   El Nº de despacho lo asigna el correlativo CENTRAL al recibir el llamado.
   Una vez asignado queda cerrado: es el ID de toda la trazabilidad.
   Modo demo: base compartida del dominio + canal en vivo entre pantallas.
   Producción: estos mismos métodos apuntan a la API central de LTELC. */
const DB_KEY='BITACORA_DB_V1';
let MEMDB=null,BC=null;try{BC=new BroadcastChannel('bitacora');}catch(e){}
const SEED_DESP={
'636':{nro:'636',es:'E',serv:'ENT-ZC',buque:'MSC ADELE',med:'335 x 45.60',eslora:'335',manga:'45.60',puntal:'',agen:'MSC',band:'PANAMÁ',fecha:'2026-06-09',hora:'21:30',horaTxt:'ETA ZC 09/ 2130 Hs',cal:'9.7 / 9.80',cpr:'9.7',cpp:'9.8',desde:'ZONA COMÚN',hasta:'EXOLGAN II',bow:'ok',cf:'',uf:'',prac:'CASTRO',prac2:'LUZZI G',pcos:['CASTRO','LUZZI G'],logi:'VICTOR: 3 hs antes ambos · ALLUEN: OK 2030 · ANTARES: LUCIO QUERANDI BERNARDO',estado:'encurso'},
'637':{nro:'637',es:'S',serv:'SAL-ZC',buque:'TIGER PLATA',med:'169.99 x 28.10',eslora:'169.99',manga:'28.10',puntal:'14.20',agen:'AMI',band:'SINGAPUR',fecha:'2026-06-10',hora:'02:00',horaTxt:'ETD 10/ 0200 Hs',desde:'DNA C 5TA',hasta:'ZONA COMÚN',cf:'85',uf:'84.7868',prac:'BERMUDEZ',pcos:['BERMUDEZ'],logi:'SAR: 0130 / MORA',estado:'cerrado',cerradoPor:'BERMUDEZ (práctico)',resumen:'Maniobra sin novedades. Marea creciente, viento SE moderado, visibilidad buena. Sin demoras.'},
'638':{nro:'638',es:'S',serv:'SAL-ZC',buque:'CABO PILAR',med:'228 x 32.20',eslora:'228',manga:'32.20',puntal:'19.80',agen:'RAIZEN',band:'ARGENTINA',senal:'LW3373',fecha:'2026-06-10',hora:'06:30',horaTxt:'ETD 10/ 0630',desde:'DDI A’',hasta:'ZONA COMÚN',cf:'182',uf:'181.7046',prac:'IGLESIAS',pcos:['IGLESIAS'],logi:'PEDRO: 0600 · ONA TRIUNFO · ETA 0730 KM 11',estado:'pendasesor',obsTxt:'Demora en zarpada a la espera de remolcador.'},
'639':{nro:'639',es:'S',serv:'SAL-ZC',buque:'JULIO A',med:'120 x 20.40',eslora:'120',manga:'20.40',puntal:'11.90',agen:'RAIZEN',band:'ARGENTINA',fecha:'2026-06-10',hora:'21:00',horaTxt:'POB 10/ 2100 HS',desde:'DDI B',hasta:'ZONA COMÚN',cf:'65',uf:'36.4140',prac:'MILANI',pcos:['MILANI'],logi:'GASTON: 2000 · SR',estado:'asignado'}
};
function dbRaw(){try{const v=localStorage.getItem(DB_KEY);return v?JSON.parse(v):MEMDB;}catch(e){return MEMDB;}}
function dbPut(db){MEMDB=db;try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}try{BC&&BC.postMessage('upd');}catch(e){}}
function dbInit(){let db=dbRaw();if(!db){db={seq:639,desp:JSON.parse(JSON.stringify(SEED_DESP))};dbPut(db);}return db;}
function asignarNro(){const db=dbInit();db.seq++;dbPut(db);return String(db.seq);}
function dbWriteOne(d){const db=dbInit();db.desp[d.nro]=Object.assign(db.desp[d.nro]||{},d);dbPut(db);}
function dbWriteDesp(arr){const db=dbInit();arr.forEach(d=>{if(d&&d.nro)db.desp[d.nro]=Object.assign(db.desp[d.nro]||{},d);});dbPut(db);}
function dbDeleteDesp(nro){const db=dbInit();delete db.desp[nro];dbPut(db);}
function pushNotif(msg,kind){
  try{const db=dbInit();db.notifs=db.notifs||[];
    db.notifs.push({t:new Date().toISOString(),msg,kind:kind||'info'});
    if(db.notifs.length>120)db.notifs=db.notifs.slice(-120);dbPut(db);}catch(e){}
}
function dbNotifs(){const db=dbInit();return db.notifs||[];}
function dbLoadDesp(){
  const db=dbInit();
  return Object.values(db.desp).filter(d=>d&&d.nro).map(x=>{
    const d=Object.assign({prac:'',prac2:'',stamps:{},ruta:{},demoras:[],obsChips:[],remol:[],tramos:[],cortes:[],obsTxt:'',resumen:'',logi:'',cal:'',med:'',horaTxt:'',es:'',serv:'',cf:'',uf:'',cpr:'',cpp:'',bow:'',band:'',senal:'',eslora:'',manga:'',puntal:'',agen:'',fecha:'',hora:'',pcos:null,cerradoPor:'',cerradoEn:'',lancha:'',rem:'',cmaq:'si'},x);
    d.id=d.id||'d'+d.nro;d.nroFinal=d.nroFinal||d.nro;
    if(!d.pcos||!d.pcos.length)d.pcos=[d.prac].concat(d.prac2?[d.prac2]:[]).filter(Boolean);
    return d;
  }).sort((a,b)=>parseInt(a.nro)-parseInt(b.nro));
}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function fmtFull(iso){if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function despView(d){const zc=v=>v==='ZONA COMÚN'?'ZC':(v||'—');const es=d.es||(d.serv==='ENT-ZC'?'E':d.serv==='SAL-ZC'?'S':d.serv==='MOV'?'M':'E');const pcos=(d.pcos&&d.pcos.length)?d.pcos:[d.prac].concat(d.prac2?[d.prac2]:[]).filter(Boolean);return {es,pcos};}

let DSP=dbLoadDesp();let RNG='mes';
function inRange(fecha,r){
  if(r==='all')return true;
  if(!fecha)return false;
  const d=new Date(fecha+'T00:00:00'),now=new Date();
  if(r==='dia')return fecha===now.toISOString().slice(0,10);
  if(r==='ano')return d.getFullYear()===now.getFullYear();
  if(r==='mes')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(r==='sem'){const ms=now-d;return ms>=0&&ms<7*864e5;}
  return false;
}
function man(d){return (d.pcos&&d.pcos.length)||(d.prac2?2:1);}
function fdate(d){return d.fecha||(d.creado||'').slice(0,10);}
function groupBars(list,keyfn,host,cls){
  const m={};list.forEach(d=>{const ks=keyfn(d);(Array.isArray(ks)?ks:[ks]).forEach(k=>{if(!k)return;m[k]=(m[k]||0)+1;});});
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mx=Math.max(1,...arr.map(x=>x[1]));
  $(host).innerHTML=arr.length?arr.map(([k,v])=>'<div class="bar-row"><div class="bl">'+k+'</div><div class="bt"><i class="'+(cls||'')+'" style="width:'+(v/mx*100)+'%"></i></div><div class="bv">'+v+'</div></div>').join(''):'<div class="empty">Sin datos en el período.</div>';
}
function render(){
  const list=DSP.filter(d=>inRange(fdate(d),RNG));
  const maniobras=list.reduce((a,d)=>a+man(d),0);
  const ent=list.filter(d=>(d.serv||'').startsWith('ENT')||d.es==='E').length;
  const sal=list.filter(d=>(d.serv||'').startsWith('SAL')||d.es==='S').length;
  const cer=list.filter(d=>d.estado==='cerrado').length;
  $('kpis').innerHTML=
    '<div class="kpi"><div class="v">'+list.length+'</div><div class="l">Despachos</div></div>'+
    '<div class="kpi k2"><div class="v">'+maniobras+'</div><div class="l">Maniobras (puntos)</div></div>'+
    '<div class="kpi k3"><div class="v">'+ent+' / '+sal+'</div><div class="l">Entradas / Salidas</div></div>'+
    '<div class="kpi k4"><div class="v">'+cer+'</div><div class="l">Cerrados</div></div>';
  // serie temporal
  const now=new Date();let buckets=[];
  if(RNG==='dia'){for(let h=0;h<24;h+=3){buckets.push({lab:pad(h)+'h',test:d=>{const dd=new Date((d.creado||fdate(d)+'T00:00:00'));return fdate(d)===now.toISOString().slice(0,10)&&dd.getHours()>=h&&dd.getHours()<h+3;}});}}
  else if(RNG==='sem'){for(let i=6;i>=0;i--){const day=new Date(now-i*864e5);const ds=day.toISOString().slice(0,10);buckets.push({lab:['DO','LU','MA','MI','JU','VI','SA'][day.getDay()],test:d=>fdate(d)===ds});}}
  else if(RNG==='mes'){for(let i=0;i<4;i++){buckets.push({lab:'Sem '+(i+1),test:d=>{const day=new Date(fdate(d)+'T00:00:00');return day.getMonth()===now.getMonth()&&day.getFullYear()===now.getFullYear()&&Math.floor((day.getDate()-1)/7)===i;}});}}
  else{const M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];for(let m=0;m<12;m++){buckets.push({lab:M[m],test:d=>{const day=new Date(fdate(d)+'T00:00:00');return day.getMonth()===m&&(RNG==='all'||day.getFullYear()===now.getFullYear());}});}}
  const counts=buckets.map(b=>DSP.filter(d=>(RNG==='all'?true:inRange(fdate(d),RNG))&&b.test(d)).length);
  const mx=Math.max(1,...counts);
  $('spark').innerHTML=buckets.map((b,i)=>'<div class="col"><div class="cv">'+counts[i]+'</div><div class="bar" style="height:'+(counts[i]/mx*110)+'px"></div><div class="cl">'+b.lab+'</div></div>').join('');
  // agrupaciones
  groupBars(list,d=>d.agen,'byAgen');
  groupBars(list,d=>despView(d).pcos,'byPrac','g');
  groupBars(list,d=>d.buque,'byBuque');
  groupBars(list,d=>{const v=despView(d);return (d.serv==='ENT-ZC'||v.es==='E')?(d.hasta||'—'):(d.serv==='SAL-ZC'||v.es==='S')?(d.desde||'—'):(d.desde||'—');},'byZona','o');
  // tabla por naviera
  const ag={};list.forEach(d=>{const k=d.agen||'—';ag[k]=ag[k]||{d:0,m:0,e:0,s:0,c:0};ag[k].d++;ag[k].m+=man(d);const v=despView(d);if((d.serv||'').startsWith('ENT')||v.es==='E')ag[k].e++;if((d.serv||'').startsWith('SAL')||v.es==='S')ag[k].s++;if(d.estado==='cerrado')ag[k].c++;});
  const rows=Object.entries(ag).sort((a,b)=>b[1].d-a[1].d);
  $('tblAgen').querySelector('tbody').innerHTML=rows.length?rows.map(([k,o])=>'<tr><td>'+k+'</td><td class="n">'+o.d+'</td><td class="n">'+o.m+'</td><td class="n">'+o.e+'</td><td class="n">'+o.s+'</td><td class="n">'+o.c+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">Sin datos en el período.</td></tr>';
}
$('rng').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('rng').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RNG=b.dataset.r;render();});
if(BC)BC.onmessage=()=>{DSP=dbLoadDesp();render();};
setInterval(()=>{DSP=dbLoadDesp();render();},3000);
render();
</script>
</body>
</html>
